<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="14" y="16" width="935" height="495" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="935" height="495" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,30)">
    <rect x="150" y="0" width="520" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="410" y="31" font-size="16" font-family="Consolas, monospace" font-weight="600" fill="#92400e" text-anchor="middle">nuget-installer (Program)</text>
    <text x="410" y="53" font-size="13" fill="#92400e" text-anchor="middle">command-line tool run by you or your build script</text>
    <line x1="410" y1="74" x2="410" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="422" y="100" font-size="12" fill="#334155">-o, -ExcludeVersion, --validate ...</text>

    <rect x="150" y="122" width="520" height="328" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="166" y="148" font-size="14" font-weight="600" fill="#2563eb">DemaConsulting.NuGetInstaller</text>

    <rect x="170" y="162" width="480" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="410" y="185" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">Cli</text>
    <text x="410" y="204" font-size="12" fill="#166534" text-anchor="middle">Parses flags into a Context that owns the output streams</text>

    <rect x="170" y="230" width="230" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="285" y="256" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">Utilities</text>
    <text x="285" y="276" font-size="12" fill="#1e40af" text-anchor="middle">Safe path handling</text>
    <rect x="420" y="230" width="230" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="535" y="256" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">SelfTest</text>
    <text x="535" y="276" font-size="12" fill="#1e40af" text-anchor="middle">With --validate, runs the</text>
    <text x="535" y="291" font-size="12" fill="#1e40af" text-anchor="middle">tool's built-in checks</text>

    <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2">
      <rect x="170" y="318" width="150" height="100" rx="12"/>
      <rect x="335" y="318" width="150" height="100" rx="12"/>
      <rect x="500" y="318" width="150" height="100" rx="12"/>
    </g>
    <g text-anchor="middle">
      <g font-size="12" font-weight="600" fill="#4c1d95">
        <text x="245" y="344">PackagesConfigReader</text>
        <text x="410" y="344">PackageInstaller</text>
        <text x="575" y="344">PackageExtractor</text>
      </g>
      <g font-size="11" fill="#5b21b6">
        <text x="245" y="366">Parses packages.config</text>
        <text x="245" y="381">into a list of package</text>
        <text x="245" y="396">entries</text>
        <text x="410" y="366">Resolves each package</text>
        <text x="410" y="381">from the NuGet cache,</text>
        <text x="410" y="396">installing in parallel</text>
        <text x="575" y="366">Unpacks the .nupkg and</text>
        <text x="575" y="381">skips folders that</text>
        <text x="575" y="396">already exist</text>
      </g>
    </g>
    <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
      <line x1="322" y1="368" x2="333" y2="368"/>
      <line x1="487" y1="368" x2="498" y2="368"/>
    </g>

    <text x="60" y="326" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Inputs</text>
    <rect x="0" y="338" width="120" height="60" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="363" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Package list</text>
    <text x="60" y="383" font-size="12" fill="#475569" text-anchor="middle">packages.config</text>
    <rect x="0" y="408" width="120" height="56" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="431" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">NuGet feeds</text>
    <text x="60" y="451" font-size="12" fill="#475569" text-anchor="middle">and global cache</text>
    <line x1="124" y1="368" x2="166" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <polyline points="124,436 410,436 410,422" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <rect x="710" y="326" width="165" height="84" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="792" y="352" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">Outputs</text>
    <g font-size="13" fill="#14532d" text-anchor="middle">
      <rect x="724" y="364" width="137" height="30" rx="5" fill="#ffffff" stroke="#16a34a"/>
      <text x="792" y="384">Extracted packages</text>
    </g>
    <line x1="654" y1="368" x2="706" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
