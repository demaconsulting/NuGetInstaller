---
# Root requirements file - includes all system, unit, platform, and OTS requirements
#
# root-tags identifies which requirements are "roots" that every other requirement must
# trace up to. Any requirement not reachable from a requirement tagged with one of these
# tags is reported as an orphan by `dotnet reqstream --enforce`, without needing a
# separate command or flag.
root-tags:
  - system
  - quality

includes:
  - docs/reqstream/nuget-installer.yaml
  - docs/reqstream/quality.yaml
  - docs/reqstream/nuget-installer/program.yaml
  - docs/reqstream/nuget-installer/cli.yaml
  - docs/reqstream/nuget-installer/cli/context.yaml
  - docs/reqstream/nuget-installer/nuget.yaml
  - docs/reqstream/nuget-installer/nuget/models.yaml
  - docs/reqstream/nuget-installer/nuget/models/package-entry.yaml
  - docs/reqstream/nuget-installer/nuget/packages-config-reader.yaml
  - docs/reqstream/nuget-installer/nuget/package-extractor.yaml
  - docs/reqstream/nuget-installer/nuget/package-installer.yaml
  - docs/reqstream/nuget-installer/self-test.yaml
  - docs/reqstream/nuget-installer/self-test/validation.yaml
  - docs/reqstream/nuget-installer/utilities.yaml
  - docs/reqstream/nuget-installer/utilities/path-helpers.yaml
  - docs/reqstream/nuget-installer/platform-requirements.yaml
  - docs/reqstream/ots/xunit.yaml
  - docs/reqstream/ots/reqstream.yaml
  - docs/reqstream/ots/buildmark.yaml
  - docs/reqstream/ots/versionmark.yaml
  - docs/reqstream/ots/sarifmark.yaml
  - docs/reqstream/ots/sonarmark.yaml
  - docs/reqstream/ots/reviewmark.yaml
  - docs/reqstream/ots/pandoc.yaml
  - docs/reqstream/ots/weasyprint.yaml
  - docs/reqstream/ots/fileassert.yaml
  - docs/reqstream/ots/sysml2tools.yaml
